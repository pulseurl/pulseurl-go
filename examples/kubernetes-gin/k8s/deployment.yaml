apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulseurl-go-example
  labels:
    app: pulseurl-go-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulseurl-go-example
  template:
    metadata:
      labels:
        app: pulseurl-go-example
    spec:
      containers:
      - name: app
        image: ${FULL_IMAGE}
        ports:
        - name: http
          containerPort: ${HTTP_PORT}
        env:
        - name: PULSEURL_SERVICE
          value: "${PULSEURL_SERVICE}"
        - name: SERVICE_NAME
          value: "${SERVICE_NAME}"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: ENVIRONMENT
          value: "${ENVIRONMENT}"
        - name: PORT
          value: "${HTTP_PORT}"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
